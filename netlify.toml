[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # VITE_ADMIN_PHONES isn't a real secret (all VITE_* vars ship in the public
  # JS bundle already) — it only tripped the scanner because the same number
  # is hardcoded as the WhatsApp fallback in src/config/store.js.
  SECRETS_SCAN_OMIT_KEYS = "VITE_ADMIN_PHONES"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
